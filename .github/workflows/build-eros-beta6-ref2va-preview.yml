name: Build ErosMax beta6 Ref2VA Preview (isolated tag)

on:
  push:
    branches:
      - feature/erosmax-beta6-ref2va-preview
    paths:
      - Dockerfile.ref2va-beta6
      - eros_ref2va.py
      - handler.py
      - h3_extender_poc.py
      - registered_lora.py
      - extender_r2_io.py
      - .github/workflows/build-eros-beta6-ref2va-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated Eros beta6 Ref2VA Preview
        uses: actions/checkout@v4
      - name: Free disk space for large existing model layers
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Prepare Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish only the isolated Ref2VA tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ref2va-beta6
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/towtsubac-dev/comfyui-runpod-serverless-erosmax:beta6-ref2va-preview-20261112
