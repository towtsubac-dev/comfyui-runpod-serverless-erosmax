name: Build ErosMax beta6 Ref2VA Preview (isolated tag)

# Manual fallback only. The preferred path is RunPod GitHub direct build.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated Eros beta6 Ref2VA Preview
        uses: actions/checkout@v4
      - name: Free disk space for large existing model layers
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Prepare Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish only the isolated Ref2VA tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ref2va-beta6
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/towtsubac-dev/comfyui-runpod-serverless-erosmax:beta6-ref2va-preview-20261112
