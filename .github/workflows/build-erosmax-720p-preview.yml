name: 720p eros-720p isolated Preview
on:
  push:
    branches:
      - feature/erosmax-720p-preview-20261123
    paths:
      - .github/workflows/build-erosmax-720p-preview.yml
      - Dockerfile.720p-preview
      - handler.py
      - video_720p.py
      - eros_ref2va.py
      - tests/test_video_720p.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eros-720p-isolated-preview
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check source syntax
        run: python3 -m py_compile handler.py video_720p.py eros_ref2va.py
      - name: Test image crop contract
        run: python3 -m unittest discover -s tests -p 'test_video_720p.py' -v

  publish-preview:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache /usr/local/share/powershell
          docker system prune -af || true
          df -h
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect base image before building
        run: docker buildx imagetools inspect ghcr.io/towtsubac-dev/comfyui-runpod-serverless-erosmax@sha256:913e9e05292fa24d1bd4f0a67bf70155b7182244b5e5634dffb32291506b9b40
      - name: Build isolated 720p preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.720p-preview
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository_owner }}/comfyui-runpod-serverless-erosmax:eros-720p-${{ github.sha }}
      - name: Inspect published image
        run: |
          image="ghcr.io/${{ github.repository_owner }}/comfyui-runpod-serverless-erosmax:eros-720p-${{ github.sha }}"
          docker buildx imagetools inspect "$image"
          echo "Published: $image" >> "$GITHUB_STEP_SUMMARY"
