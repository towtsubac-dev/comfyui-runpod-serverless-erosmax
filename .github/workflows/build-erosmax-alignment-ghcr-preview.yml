name: ErosMax Alignment GHCR Preview (isolated)

on:
  push:
    branches:
      - ci/erosmax-alignment-ghcr-preview-20261120
      - ci/erosmax-extender-32px-fix-20261120
    paths:
      - .github/workflows/build-erosmax-alignment-ghcr-preview.yml
      - Dockerfile.eros-extend-alignment-preview
      - handler.py
      - h3_extender_poc.py
      - registered_lora.py
      - extender_r2_io.py
      - eros_ref2va.py
      - lora_url_policy.py
      - tests/test_h3_extender_poc.py
      - tests/test_eros_standard_extend_alignment.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erosmax-alignment-ghcr-preview
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: |
          python -m py_compile handler.py h3_extender_poc.py registered_lora.py extender_r2_io.py eros_ref2va.py lora_url_policy.py tests/test_eros_standard_extend_alignment.py
      - name: Install FFmpeg and ffprobe for all regression tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Run all 32px alignment and FFmpeg contract tests
        run: |
          python -m unittest discover -s tests -p 'test_eros_standard_extend_alignment.py' -v
          python -m unittest discover -s tests -p 'test_h3_extender_poc.py' -v

  publish-preview:
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify immutable model base is reachable
        run: |
          docker buildx imagetools inspect ghcr.io/towtsubac-dev/comfyui-runpod-serverless-erosmax@sha256:9ba7121bd64b86f798b97deaec7b1d1aca4bcfe9e64cc361046d50ee790111ff
      - name: Build and push isolated code-only preview
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.eros-extend-alignment-preview
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/towtsubac-dev/comfyui-runpod-serverless-erosmax:eros-align-${{ github.sha }}
      - name: Inspect published image and record tag
        run: |
          image="ghcr.io/towtsubac-dev/comfyui-runpod-serverless-erosmax:eros-align-${{ github.sha }}"
          docker buildx imagetools inspect "$image"
          echo "Published: $image" >> "$GITHUB_STEP_SUMMARY"
