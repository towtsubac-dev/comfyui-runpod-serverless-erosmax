name: Build H3 Extender PoC Image (isolated tag)

on:
  push:
    branches:
      - feature/erosmax-h3-extender-poc
    paths:
      - .github/workflows/build-h3-extender-poc-image.yml

permissions:
  contents: read
  packages: write

jobs:
  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated H3 Extender PoC
        uses: actions/checkout@v4

      - name: Reclaim runner storage for bundled model weights
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Prepare Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ONLY isolated Extender tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.extender-poc
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/towtsubac-dev/comfyui-runpod-serverless-erosmax:h3-extender-poc-20261109

      - name: Show image URL
        run: echo "ghcr.io/towtsubac-dev/comfyui-runpod-serverless-erosmax:h3-extender-poc-20261109"
