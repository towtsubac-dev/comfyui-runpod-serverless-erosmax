name: ErosMax REF2VA 15s code-only image
on:
  push:
    branches:
      - release/erosmax-ref2va15-20261121
    paths:
      - eros_ref2va.py
      - tests/test_eros_ref2va.py
      - Dockerfile.ref2va15-overlay
      - .github/workflows/build-ref2va15-overlay.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erosmax-ref2va15-20261121
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow requests
      - name: Check native graph contract and Python syntax
        run: |
          python -m py_compile eros_ref2va.py tests/test_eros_ref2va.py
          python -m unittest discover -s tests -p 'test_eros_ref2va.py' -v

  publish-image:
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push isolated overlay
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ref2va15-overlay
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/towtsubac-dev/comfyui-runpod-serverless-erosmax:ref2va15-${{ github.sha }}
      - name: Published reference
        run: |
          image="ghcr.io/towtsubac-dev/comfyui-runpod-serverless-erosmax:ref2va15-${{ github.sha }}"
          docker buildx imagetools inspect "$image"
          echo "$image" >> "$GITHUB_STEP_SUMMARY"
