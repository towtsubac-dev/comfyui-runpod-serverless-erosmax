name: Build SageAttention Test Image

on:
  push:
    branches:
      - feature/sageattention-rtx4090-test
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          secrets: |
            civitai_api_token=${{ secrets.CIVITAI_API_TOKEN }}
          tags: ghcr.io/${{ github.repository_owner }}/comfyui-runpod-serverless-erosmax:sageattention-test
