name: Build Docker Image

on:
  push:
    branches:
      - cachetest
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        env:
          CIVITAI_API_TOKEN: ${{ secrets.CIVITAI_API_TOKEN }}
        with:
          context: .
          secret-envs: |
            civitai_api_token=CIVITAI_API_TOKEN
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/comfyui-runpod-serverless-erosmax:cachetest
