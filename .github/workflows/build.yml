name: Build Docker Image

on:
  push:
    branches:
      - main
      - cachetest
      - eros-video-extend-test
      - erosmax-variable-extension-test
      - feature/mystic-xxx-combined-loras
      - feature/eros-lora-library
      - feature/r2-only-eros-loras
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        env:
          CIVITAI_API_TOKEN: ${{ secrets.CIVITAI_API_TOKEN }}
        with:
          context: .
          secret-envs: |
            civitai_api_token=CIVITAI_API_TOKEN
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/comfyui-runpod-serverless-erosmax:${{ github.ref_name == 'main' && 'latest' || github.ref_name == 'eros-video-extend-test' && 'extend-test' || github.ref_name == 'erosmax-variable-extension-test' && 'duration-test' || github.ref_name == 'feature/mystic-xxx-combined-loras' && 'mystic-lora-test' || github.ref_name == 'feature/eros-lora-library' && 'lora-library-test' || github.ref_name == 'feature/r2-only-eros-loras' && 'r2-only-test' || 'cachetest' }}
            ${{ github.ref_name == 'main' && format('ghcr.io/{0}/comfyui-runpod-serverless-erosmax:v1', github.repository_owner) || '' }}
