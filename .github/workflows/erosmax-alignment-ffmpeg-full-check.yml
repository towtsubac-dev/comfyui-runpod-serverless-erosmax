name: ErosMax Alignment FFmpeg Full Regression (no Docker build)
on:
  push:
    branches:
      - test/erosmax-align-ghcr-publish-20261120
    paths:
      - .github/workflows/erosmax-alignment-ffmpeg-full-check.yml
      - handler.py
      - tests/test_eros_standard_extend_alignment.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ffmpeg-full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install both ffmpeg and ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Real-video regression for 32px alignment and silent audio
        run: |
          python -m py_compile handler.py tests/test_eros_standard_extend_alignment.py
          python -m unittest discover -s tests -p test_eros_standard_extend_alignment.py -v
