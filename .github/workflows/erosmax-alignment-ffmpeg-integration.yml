name: ErosMax Alignment FFmpeg Integration (no image build)

on:
  push:
    branches:
      - ci/erosmax-alignment-ghcr-preview-20261120
    paths:
      - .github/workflows/erosmax-alignment-ffmpeg-integration.yml
      - handler.py
      - tests/test_eros_standard_extend_alignment.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ffmpeg-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and ffprobe for real video tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Run ALL alignment tests including real MP4 and audio cases
        run: |
          python -m py_compile handler.py tests/test_eros_standard_extend_alignment.py
          python -m unittest discover -s tests -p 'test_eros_standard_extend_alignment.py' -v
