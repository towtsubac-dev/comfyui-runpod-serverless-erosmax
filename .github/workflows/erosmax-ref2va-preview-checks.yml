name: ErosMax beta6 Ref2VA Preview Static Checks

on:
  push:
    branches:
      - feature/erosmax-beta6-ref2va-preview
    paths:
      - handler.py
      - eros_ref2va.py
      - Dockerfile.ref2va-beta6
      - tests/test_eros_ref2va.py
      - .github/workflows/erosmax-ref2va-preview-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local test dependencies
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Check Python syntax
        run: python -m py_compile handler.py eros_ref2va.py tests/test_eros_ref2va.py
      - name: Run offline Ref2VA tests (no GPU, no RunPod charge)
        run: python -m unittest discover -s tests -p test_eros_ref2va.py -v
