name: ErosMax Flash Preview CPU Checks

on:
  push:
    branches:
      - feature/erosmax-v11-flash-preview
      - fix/erosmax-slow-fade-v12-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only test dependencies
        run: python -m pip install numpy==2.3.5
      - name: Verify Python syntax
        run: python -m py_compile handler.py registered_lora.py tests/test_erosmax_flash_preview.py
      - name: Verify v10/v11 flash detection and safe fallback
        run: python -m unittest discover -s tests -p 'test_erosmax_flash_preview.py' -v
