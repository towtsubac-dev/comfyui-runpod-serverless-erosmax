name: LoRA branch checks
on:
  push:
    branches:
      - feature/eros-lora-library
  pull_request:
    branches:
      - main
jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: python -m py_compile handler.py registered_lora.py
      - run: python -m unittest -v test_registered_lora.py
