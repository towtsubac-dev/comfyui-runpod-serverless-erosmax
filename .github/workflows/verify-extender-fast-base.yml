name: Verify Extender fast-build base accessibility

on:
  push:
    branches:
      - fix/erosmax-extender-lora-fast-build
    paths:
      - Dockerfile.extender-lora-fast
      - .github/workflows/verify-extender-fast-base.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check that unauthenticated container builder can resolve pinned GHCR base
        run: |
          set -euo pipefail
          base="ghcr.io/towtsubac-dev/comfyui-runpod-serverless-erosmax@sha256:9ba7121bd64b86f798b97deaec7b1d1aca4bcfe9e64cc361046d50ee790111ff"
          docker manifest inspect "$base" > /dev/null
          echo "GHCR base is anonymously readable at the pinned digest."
      - name: Validate Python source and isolated contract
        run: |
          python -m py_compile handler.py h3_extender_poc.py registered_lora.py
          python -m unittest discover -s tests -p 'test_h3_extender_poc.py' -v
      - name: Confirm fast Dockerfile is copy-only after FROM
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("Dockerfile.extender-lora-fast").read_text()
          assert "FROM --platform=linux/amd64 ghcr.io/towtsubac-dev/comfyui-runpod-serverless-erosmax@sha256:" in source
          assert "COPY --link handler.py h3_extender_poc.py registered_lora.py /workspace/" in source
          for line in source.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              assert not line.startswith(("RUN ", "ADD ", "ARG ")), line
          print("Only existing base layers and three Python overlays are required.")
          PY
